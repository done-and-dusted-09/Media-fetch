plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'com.chaquo.python' }
android {
  namespace 'com.mediafetch'; compileSdk 35
  defaultConfig { applicationId 'com.mediafetch'; minSdk 24; targetSdk 35
    versionCode 1; versionName '1.0.0'
    ndk { abiFilters 'arm64-v8a', 'x86_64' } }
  buildTypes { release { minifyEnabled false } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget = '17' } }
chaquopy {
  defaultConfig {
    version = "3.11"
    // Bundled interpreter + pinned packages. Everything ships INSIDE the APK:
    // no pip / downloads at runtime. yt-dlp[default] pulls yt-dlp-ejs (bundled
    // challenge-solver scripts) so YouTube EJS never needs remote components.
    buildPython "python3"  // build-machine interpreter for pip install (portable: Linux CI + Windows + macOS)
    pip { install "yt-dlp[default]==2026.8.19" }
  }
}
dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'androidx.activity:activity-compose:1.9.2'
  implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.3'
  implementation 'androidx.compose.material3:material3:1.2.1'
  // Bundled FFmpeg/FFprobe (maintained fork of FFmpegKit: SDK 35, 16KB pages, LGPL):
  implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.7'
  testImplementation 'junit:junit:4.13.2'
}
